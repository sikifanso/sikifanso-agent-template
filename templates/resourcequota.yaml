apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-quota
  namespace: {{ include "agent.namespace" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.agent.cpuRequest | quote }}
    requests.memory: {{ .Values.agent.memoryRequest | quote }}
    limits.cpu: {{ .Values.agent.cpuLimit | quote }}
    limits.memory: {{ .Values.agent.memoryLimit | quote }}
    pods: {{ .Values.agent.pods | quote }}

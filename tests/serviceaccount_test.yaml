suite: ServiceAccount
templates:
  - serviceaccount.yaml
tests:
  - it: should create service account in agent namespace
    set:
      agent.name: my-agent
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: agent
      - equal:
          path: metadata.namespace
          value: agent-my-agent

  - it: should disable token automount
    set:
      agent.name: my-agent
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

suite: ResourceQuota
templates:
  - resourcequota.yaml
tests:
  - it: should create resource quota with default values allowing Burstable QoS
    set:
      agent.name: my-agent
    asserts:
      - isKind:
          of: ResourceQuota
      - equal:
          path: metadata.namespace
          value: agent-my-agent
      - equal:
          path: spec.hard["requests.cpu"]
          value: "250m"
      - equal:
          path: spec.hard["requests.memory"]
          value: "256Mi"
      - equal:
          path: spec.hard["limits.cpu"]
          value: "1000m"
      - equal:
          path: spec.hard["limits.memory"]
          value: "1Gi"
      - equal:
          path: spec.hard.pods
          value: "10"

  - it: should allow separate request and limit overrides
    set:
      agent.name: gpu-agent
      agent.cpuRequest: "500m"
      agent.cpuLimit: "4000m"
      agent.memoryRequest: "1Gi"
      agent.memoryLimit: "8Gi"
      agent.pods: "20"
    asserts:
      - isKind:
          of: ResourceQuota
      - equal:
          path: spec.hard["requests.cpu"]
          value: "500m"
      - equal:
          path: spec.hard["requests.memory"]
          value: "1Gi"
      - equal:
          path: spec.hard["limits.cpu"]
          value: "4000m"
      - equal:
          path: spec.hard["limits.memory"]
          value: "8Gi"
      - equal:
          path: spec.hard.pods
          value: "20"
